name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Node 24 ships npm 11.19.0. A newer local npm may be lenient about a lockfile
  # this npm rejects, so pin both sides (here + package.json "packageManager")
  # to keep local == CI. See claude-fleet-kit fleet/lessons/npm-version-skew.
  PINNED_NPM: "11.19.0"
jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Pin npm (match local — see lessons/npm-version-skew)
        run: npm install --global "npm@${{ env.PINNED_NPM }}"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        # Integration tests require OC_URL (OpenChronicle); the generator/validator
        # suites additionally require OLLAMA_GENERATOR_MODEL. OLLAMA_URL is NOT a
        # gate -- it defaults to http://localhost:11434.
        # Without them (the default in CI), those suites skip via skipIf,
        # and the unit suites still run. The vitest run validates that the
        # test infra wires up correctly across all three platforms.
        run: npm test

  quality:
    name: lint + format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Pin npm (match local — see lessons/npm-version-skew)
        run: npm install --global "npm@${{ env.PINNED_NPM }}"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # webui/ is a separate package: the root eslint config ignores it and no
      # job ran its own. Its react-hooks rules were configured but never
      # enforced, so a dependency-array violation could reach main green.
      - name: Install webui dependencies
        run: npm ci --prefix webui

      - name: Lint webui
        run: npm run lint --prefix webui

      - name: Format check
        run: npm run format:check
