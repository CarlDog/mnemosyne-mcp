# Canonical Dependabot config for the fleet.
#
# Copy to .github/dependabot.yml and DELETE the ecosystem blocks the repo
# doesn't have. Keeping a block for a manifest that isn't there is harmless
# but noisy in Dependabot's logs.
#
# The point of the `groups:` blocks is noise, not correctness. Ungrouped,
# a week of transitive npm churn arrives as ten separate PRs. Grouped, it
# arrives as at most three, split along the only line that matters when
# deciding whether to look: can this change behaviour?
#
#   <eco>-dev     dev tooling, minor+patch  -> auto-merged, you never see it
#   <eco>-runtime shipped code, minor+patch -> auto-merged only if lockfile-only
#   <eco>-major   major bumps               -> always yours to decide
#
# The group NAMES are load-bearing: fleet/scripts/auto-merge-dependabot.py
# reads them out of the branch ref to decide what it may merge. Renaming a
# group here without updating ALLOWED_GROUPS there silently stops the
# auto-merge and everything queues up instead.

version: 2
updates:
  # ── github-actions (workflows present) ────────────────────────────
  # Tag refs float within a major only, so a pinned @v4 never becomes @v7 on
  # its own. Review the gitleaks-action bump deliberately rather than
  # auto-merging it: gitleaks.yml calls it the fleet's universal CI floor.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions

  # ── npm (package.json present) ────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    ignore:
      # typescript-eslint 8.65 accepts TypeScript <6.1. Keep TypeScript 6
      # current while deferring only the incompatible TypeScript 7 line.
      - dependency-name: typescript
        versions: ["7.x"]
      # Keep declaration majors aligned with the Node runtime floor. Remove
      # this only when engines.node and CI move in the same change.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-dev:
        dependency-type: development
        update-types: [minor, patch]
      npm-runtime:
        dependency-type: production
        update-types: [minor, patch]
      npm-major:
        update-types: [major]

  # ── npm (webui/ is a separate package, not a workspace) ───────────
  # The root package.json declares no `workspaces`, so Dependabot never reads
  # webui/package.json from the block above -- its 19 dependencies had zero
  # update coverage while being shipped code (src/index.ts serves the built
  # bundle). Group names MUST match the root block: the fleet auto-merge
  # script parses them out of the branch ref, not the directory.
  - package-ecosystem: npm
    directory: /webui
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    ignore:
      # typescript-eslint 8.69 accepts TypeScript <6.1. Keep TypeScript 6
      # current while deferring only the incompatible TypeScript 7 line.
      - dependency-name: typescript
        versions: ["7.x"]
      # Keep declaration majors aligned with the Node runtime floor. Remove
      # this only when engines.node and CI move in the same change.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-dev:
        dependency-type: development
        update-types: [minor, patch]
      npm-runtime:
        dependency-type: production
        update-types: [minor, patch]
      npm-major:
        update-types: [major]
